<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZEmu</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #screen_container { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* v86 text mode (when the guest uses VGA text and use_graphical_text is off) */
  #screen_container > div { white-space: pre; font: 14px monospace; line-height: 14px; color: #fff; }
  #screen_container > canvas { display: none; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="screen_container"><div></div><canvas></canvas></div>
<script>
  // v86 picks its main-loop scheduler when libv86.js loads: a blob-URL Worker when Worker exists, else setTimeout.
  // If this origin cannot create blob workers, hide Worker so v86 falls back instead of failing.
  try {
    const url = URL.createObjectURL(new Blob(["onmessage = (e) => postMessage(e.data);"], { type: "text/javascript" }));
    const probe = new Worker(url);
    probe.terminate();
    URL.revokeObjectURL(url);
  } catch (e) {
    window.__zemuWorkerError = String(e);
    try { window.Worker = undefined; } catch (_) {}
  }
</script>
<script src="zemu://app/v86/libv86.js"></script>
<script src="zemu://app/host/emu.js"></script>
</body>
</html>
