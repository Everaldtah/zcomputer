# XcodeGen spec: `xcodegen generate` writes ZComputer.xcodeproj (generated in CI, never committed).
# MLX (in-app local models) is opt-in because it is slow to build and needs Xcode 26.4+ (Swift 6.3):
#   ZC_MLX=YES xcodegen generate   # adds the MLX packages and the ZC_MLX compile condition
#   xcodegen generate              # the same app without MLX (MLXClient compiles out)
# See docs/APP.md.
name: ZComputer

include:
  - path: ZComputer/Config/mlx.yml
    relativePaths: false
    enable: ${ZC_MLX}
  # The same MLX packages (declared once, in mlx.yml) for the iPhone/iPad app.
  - path: ZComputeriOS/Config/mlx-ios.yml
    relativePaths: false
    enable: ${ZC_MLX}

options:
  bundleIdPrefix: com.everaldtah
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: BXQW8UBNM2
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ZKit:
    path: ZKit
  # Virtualization.framework layer (macOS only).
  ZVM:
    path: ZVM
  # x86 PCs emulated by v86 in a WKWebView (iOS 17+ / macOS 15+): the iPhone/iPad app's machines. docs/EMU.md.
  ZEmu:
    path: ZEmu
  # Terminal emulator view. 1.99.x declares swift-tools-version 6.2 (Xcode 26+) and ships a build-tool plugin,
  # so xcodebuild needs -skipPackagePluginValidation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1

schemes:
  ZComputer:
    build:
      targets:
        ZComputer: all
    run:
      config: Debug
    archive:
      config: Release
  ZComputeriOS:
    build:
      targets:
        ZComputeriOS: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ZComputer:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ZComputer
        excludes:
          - "**/.DS_Store"
          - "Config/**"
          - "Resources/zguest"
          - "Resources/zguest/**"
      # The static Linux guest-agent binaries (CI copies them in from the `guest` job). A folder reference keeps
      # them in Contents/Resources/zguest, which VMController shares read-only into Linux guests.
      - path: ZComputer/Resources/zguest
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZKit
        products: [ZCore, ZProviders, ZAgent, ZMemory, ZTeam, ZLocal]
      - package: ZVM
        product: ZVM
      - package: SwiftTerm
        product: SwiftTerm
      - sdk: Virtualization.framework
    entitlements:
      # Committed as-is (docs/research/virtualization.md (a)); no `properties` so XcodeGen never rewrites it.
      path: ZComputer/ZComputer.entitlements
    info:
      path: ZComputer/Info.plist
      properties:
        CFBundleDisplayName: Z Computer
        CFBundleName: Z Computer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Everald Tah"
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Z Computer looks for AI model servers (Ollama, LM Studio, llama.cpp, Jan, vLLM) on this Mac and on addresses you enter, so agents can use your own local models.
        NSDesktopFolderUsageDescription: The terminal and the agent's file import can read files on your Desktop when you ask them to.
        NSDocumentsFolderUsageDescription: The terminal and the agent's file import can read files in Documents when you ask them to.
        NSDownloadsFolderUsageDescription: Z Computer reads installer images (ISO, IPSW) and documents you pick from Downloads.
        NSRemovableVolumesUsageDescription: Z Computer reads installer images you pick from external drives.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.zcomputer
        PRODUCT_NAME: ZComputer
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode 15+ drops com.apple.security.app-sandbox from the entitlements unless this is YES (App Store rejects the upload otherwise)
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # Z Computer for iPhone and iPad: same bundle id as the Mac app (universal App ID, one App Store Connect record,
  # universal purchase). ZKit is shared as-is; the machine is x86 Linux emulated in WebKit (ZEmu). ZVM is macOS-only
  # and is not linked here. See docs/IOS.md.
  ZComputeriOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZComputeriOS
        excludes:
          - "**/.DS_Store"
          - "Config/**"
      # Platform-neutral app code shared with the Mac target (no AppKit, no ZVM). Keep these files portable.
      - path: ZComputer/Agent/ActivityItem.swift
      - path: ZComputer/Agent/AgentSession.swift
      - path: ZComputer/Agent/DemoScreenRenderer.swift
      - path: ZComputer/Agent/MockComputerSurface.swift
      - path: ZComputer/App/AppSettings.swift
      - path: ZComputer/Library/LibraryModel.swift
      - path: ZComputer/Local/LocalModelsModel.swift
      - path: ZComputer/Local/MLXClient.swift
      - path: ZComputer/Local/MLXTokenizerBridge.swift
      - path: ZComputer/Local/ModelDownloader.swift
      - path: ZComputer/Platform/CoreGraphicsImageResizer.swift
      - path: ZComputer/Platform/DocumentTextExtractor.swift
      - path: ZComputer/Platform/FileCustomProviderStore.swift
      - path: ZComputer/Platform/KeychainKeyStore.swift
      - path: ZComputer/Team/TeamModel.swift
    dependencies:
      - package: ZKit
        products: [ZCore, ZProviders, ZAgent, ZMemory, ZTeam, ZLocal]
      - package: SwiftTerm
        product: SwiftTerm
      - package: ZEmu
        product: ZEmu
    entitlements:
      # Committed as-is; no `properties` so XcodeGen never rewrites it.
      path: ZComputeriOS/ZComputeriOS.entitlements
    info:
      path: ZComputeriOS/Info.plist
      properties:
        CFBundleDisplayName: Z Computer
        CFBundleName: Z Computer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # One scene: the emulator's WebKit view can only live in one window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files app: drop ISOs into Z Computer's folder; imports open documents in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Z Computer connects to AI model servers you add (Ollama, LM Studio, llama.cpp, Jan, vLLM), for example on your Mac at home, so agents can use your own models.
        # Model servers people run themselves (Ollama on a Mac over Tailscale, LM Studio on the LAN) speak plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everaldtah.zcomputer
        PRODUCT_NAME: "Z Computer"
        PRODUCT_MODULE_NAME: ZComputeriOS
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Mac App Store already has the native Mac app under this bundle id.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_EMIT_LOC_STRINGS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
