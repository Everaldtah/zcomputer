# Included by project.yml only when the ZC_MLX environment variable is truthy: `ZC_MLX=YES xcodegen generate`.
# Pins from docs/research/local-models-and-agent-loops.md (B5) and ZLocal's MLXPins. mlx-swift >= 0.31.5 needs
# Xcode 26.4+ (Swift 6.3), so build on the macos-26 runner. MLX runs on Apple-silicon GPUs only, so an MLX build
# is arm64-only.
packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3        # fixes the pre-26.4 launch crash of 0.32.2
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3        # MLXLLM, MLXVLM, MLXLMCommon
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 1.0.0         # pinned for swift-transformers; the app downloads models itself (ModelDownloader)
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5         # Tokenizers, bridged in ZComputer/Local/MLXTokenizerBridge.swift

targets:
  ZComputer:
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        products: [MLXLLM, MLXVLM, MLXLMCommon]
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ZC_MLX"
        ARCHS: arm64
