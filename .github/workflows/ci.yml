# ZKit tests on Linux (cheap), guest agent build, and a macOS app build on a GitHub Mac.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build the macOS app (uses macOS minutes)"
        type: boolean
        default: true
      ios:
        description: "Also build the iPhone/iPad app (uses macOS minutes)"
        type: boolean
        default: true

jobs:
  kit:
    name: ZKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev pkg-config > /dev/null
      - name: Build + test
        shell: bash
        run: |
          set -o pipefail
          swift build --package-path ZKit 2>&1 | tee build.log | grep -E --line-buffered 'error:|warning: unre|Compiling|Build complete' || true
          grep -q 'error:' build.log && { echo "---- errors ----"; grep -E 'error:' build.log | sort -u | head -200; exit 1; }
          swift test --package-path ZKit 2>&1 | tee test.log | tail -40
      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kit-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  guest:
    name: Guest agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Build static binaries
        run: |
          if [ ! -f guest-agent/go.mod ]; then echo "no guest agent yet"; mkdir -p out; exit 0; fi
          cd guest-agent
          mkdir -p ../out
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../out/zguest-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../out/zguest-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -trimpath -ldflags="-s -w" -o ../out/zguest-linux-386 .
          set -o pipefail
          go test ./... 2>&1 | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: zguest
          path: out/
          if-no-files-found: ignore

  zvm:
    name: ZVM (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --package-path ZVM
      - name: Test
        run: swift test --package-path ZVM

  # The ZComputer app (xcodegen + xcodebuild, unsigned). macOS minutes: only on pushes to main and on request.
  # Two legs: without MLX (fast, every app change) and with MLX (ZC_MLX=YES; mlx-swift needs Xcode >= 26.4).
  app:
    name: App (macOS, MLX ${{ matrix.mlx }})
    needs: guest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mac)
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mlx: ["NO", "YES"]
    env:
      ZC_MLX: ${{ matrix.mlx }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          X=/Applications/Xcode_26.6.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Guest agent binaries (from the guest job)
        uses: actions/download-artifact@v4
        with:
          name: zguest
          path: ZComputer/Resources/zguest
      - name: Mark the guest binaries non-executable on the host (they only run inside the guest)
        run: |
          chmod a-x ZComputer/Resources/zguest/zguest-* 2>/dev/null || true
          ls -la ZComputer/Resources/zguest
      - name: Metal toolchain (the exit code lies; parse Status)
        run: |
          status() { xcodebuild -showComponent MetalToolchain 2>&1 | awk -F': *' '/^Status:/ { print tolower($2); exit }'; }
          echo "MetalToolchain: $(status)"
          [ "$(status)" = "installed" ] || xcodebuild -downloadComponent MetalToolchain
          [ "$(status)" = "installed" ] || { echo "::error::MetalToolchain still '$(status)'"; exit 1; }
      - name: Hide Homebrew's sqlite3.pc
        # ZKit's CSQLite declares pkgConfig "sqlite3" with a brew provider. With Homebrew's (keg-only, arm64-only)
        # sqlite on the runner, SwiftPM would link /opt/homebrew/opt/sqlite/lib/libsqlite3.dylib, which breaks the
        # x86_64 slice and would not exist on users' Macs. Without the .pc file the module map links the SDK's libsqlite3.
        run: find /opt/homebrew /usr/local -name 'sqlite3.pc' -print -delete 2>/dev/null || true
      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate
          echo "MLX package references: $(grep -c 'mlx-swift' ZComputer.xcodeproj/project.pbxproj || true)"
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ matrix.mlx }}-${{ hashFiles('project.yml', 'ZComputer/Config/mlx.yml') }}
          restore-keys: spm-${{ matrix.mlx }}-
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project ZComputer.xcodeproj -scheme ZComputer -configuration Debug \
            -destination 'generic/platform=macOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build.log \
            | grep -E --line-buffered '(error:|warning: unre|\*\* BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build.log || { echo "---- errors ----"; grep -E 'error:' build.log | sort -u | head -200; exit 1; }
          echo "---- app warnings ----"
          grep -E '/ZComputer/[^:]+\.swift:[0-9]+:[0-9]+: warning:' build.log | sort -u | head -80 || true
          echo "---- sqlite linkage (must be the SDK's) ----"
          APP=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -path '*Debug/ZComputer.app' | head -1)
          echo "$APP"
          # Debug builds put the code in ZComputer.debug.dylib next to the stub executable: check every binary.
          otool -L "$APP"/Contents/MacOS/* 2>/dev/null | grep -i sqlite || true
          ! otool -L "$APP"/Contents/MacOS/* 2>/dev/null | grep -q homebrew || { echo "::error::the app links Homebrew libraries"; exit 1; }
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log-mlx-${{ matrix.mlx }}
          path: build.log
          if-no-files-found: ignore

  # Z Computer for iPhone/iPad (scheme ZComputeriOS), unsigned device build. Same triggers as the Mac app.
  # MLX NO is the required leg; MLX YES (on-device models, Xcode >= 26.4) is informational.
  ios:
    name: App (iOS, MLX ${{ matrix.mlx }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-26
    timeout-minutes: 90
    continue-on-error: ${{ matrix.mlx == 'YES' }}
    strategy:
      fail-fast: false
      matrix:
        mlx: ["NO", "YES"]
    env:
      ZC_MLX: ${{ matrix.mlx }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          X=/Applications/Xcode_26.6.app
          [ -d "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Metal toolchain (the exit code lies; parse Status)
        run: |
          status() { xcodebuild -showComponent MetalToolchain 2>&1 | awk -F': *' '/^Status:/ { print tolower($2); exit }'; }
          echo "MetalToolchain: $(status)"
          [ "$(status)" = "installed" ] || xcodebuild -downloadComponent MetalToolchain
          [ "$(status)" = "installed" ] || { echo "::error::MetalToolchain still '$(status)'"; exit 1; }
      - name: iOS platform (download when the image lacks it)
        run: |
          xcodebuild -showsdks | grep -q iphoneos || xcodebuild -downloadPlatform iOS
      - name: Hide Homebrew's sqlite3.pc
        run: find /opt/homebrew /usr/local -name 'sqlite3.pc' -print -delete 2>/dev/null || true
      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate
          echo "MLX package references: $(grep -c 'mlx-swift' ZComputer.xcodeproj/project.pbxproj || true)"
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spm
          key: spm-ios-${{ matrix.mlx }}-${{ hashFiles('project.yml', 'ZComputer/Config/mlx.yml', 'ZComputeriOS/Config/mlx-ios.yml') }}
          restore-keys: spm-ios-${{ matrix.mlx }}-
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project ZComputer.xcodeproj -scheme ZComputeriOS -configuration Debug \
            -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build.log \
            | grep -E --line-buffered '(error:|warning: unre|\*\* BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build.log || { echo "---- errors ----"; grep -E 'error:' build.log | sort -u | head -200; exit 1; }
          echo "---- app warnings ----"
          grep -E '/ZComputer(iOS)?/[^:]+\.swift:[0-9]+:[0-9]+: warning:' build.log | sort -u | head -80 || true
          APP=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -path '*Debug-iphoneos/Z Computer.app' | head -1)
          echo "App: $APP"
          [ -n "$APP" ] && /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-mlx-${{ matrix.mlx }}
          path: build.log
          if-no-files-found: ignore
