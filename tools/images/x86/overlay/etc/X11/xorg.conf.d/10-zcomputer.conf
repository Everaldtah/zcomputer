# Z Alpine Desktop (x86): Xorg on the kernel framebuffer that bochs-drm creates
# for v86's Bochs/QEMU-compatible VGA (PCI 1234:1111), 1024x768x32.
# No OpenGL: GLX and glamor are off (Mesa's gallium drivers are not in the image).
# Input comes from udev hotplug: libinput for the PS/2 keyboard/mouse and the
# kernel's VMware VMMouse absolute pointer (v86 implements the VMware backdoor).

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "AutoAddGPU"  "false"
EndSection

Section "Module"
    Disable "glx"
    Disable "glamoregl"
EndSection

Section "Device"
    Identifier "fb0"
    Driver     "fbdev"
    Option     "fbdev"    "/dev/fb0"
    Option     "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "monitor0"
    Option     "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "screen0"
    Device       "fb0"
    Monitor      "monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768"
    EndSubSection
EndSection
