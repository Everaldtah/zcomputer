# Z Alpine Desktop (x86): straight into XFCE as z, no greeter, no blanking.
[Seat:*]
autologin-user=z
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter
xserver-command=X -s 0 -dpms -nolisten tcp
display-setup-script=/usr/local/sbin/zc-display-setup
